name: Buffett Weekly Screener

on:
  # Runs at 6:00 AM IST on Sundays (00:30 UTC)
  schedule:
    - cron: '30 0 * * 0'
  # Allows manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  run-buffett:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas yfinance numpy requests pytz

      - name: Run Buffett Screener
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python buffett_screener.py
